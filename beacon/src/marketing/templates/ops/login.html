<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Beacon Ops Console</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/site.css') }}">
<style>
  body{display:grid; place-items:center; min-height:100vh}
  .auth{width:380px; max-width:92vw}
  .auth .brand{justify-content:center; font-size:20px; margin-bottom:6px}
  .auth .panelbox{padding:28px}
  .auth label{display:block; font-size:13px; color:var(--muted); margin:14px 0 6px}
  .auth input{width:100%; padding:11px 12px; border-radius:9px; border:1px solid var(--line);
    background:#0a0f22; color:var(--ink); font-size:14.5px}
  .auth input:focus{outline:none; border-color:var(--brand)}
  .auth .btn{width:100%; justify-content:center; margin-top:20px}
  .err{background:rgba(255,107,107,.1); border:1px solid rgba(255,107,107,.4); color:#ffb4b4;
    padding:10px 12px; border-radius:9px; font-size:13.5px; margin-top:14px}
  .note{text-align:center; color:var(--muted); font-size:12.5px; margin-top:18px}
</style>
</head>
<body>
  <div class="auth">
    <div class="brand"><span class="logo"></span> Beacon <span style="color:var(--muted);font-weight:500">Ops Console</span></div>
    <p style="text-align:center; color:var(--muted); font-size:13.5px; margin:0 0 18px">
      Internal operations &amp; diagnostics. Authorised operators only.</p>
    <div class="panelbox">
      <form method="post">
        <label for="username">Operator</label>
        <input id="username" name="username" autocomplete="username" autofocus required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        {% if error %}<div class="err">{{ error }}</div>{% endif %}
        <button class="btn primary" type="submit">Sign in</button>
      </form>
    </div>
    <p class="note">Beacon Ops Console · build 2.7.0 · <span class="mono">internal.beacon.myl</span></p>
  </div>
</body>
</html>
