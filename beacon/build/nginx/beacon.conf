upstream beacon_site { server 127.0.0.1:8001; }
upstream repoforge   { server 127.0.0.1:8002; }

server {
    listen 80 default_server;
    server_name beacon.myl internal.beacon.myl _;

    client_max_body_size 4m;
    access_log /var/log/nginx/beacon.access.log;

    # Release download placeholders.
    location /dl/ {
        alias /var/www/dl/;
        autoindex off;
    }

    location / {
        proxy_pass http://beacon_site;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name git.beacon.myl;

    access_log /var/log/nginx/repoforge.access.log;

    # Anonymous dumb-HTTP git clone straight from the bare repositories.
    #   git clone http://git.beacon.myl/<owner>/<repo>.git
    location ~ ^/[A-Za-z0-9._-]+/[A-Za-z0-9._-]+\.git(/.*)?$ {
        root /srv/repoforge/repos;
        autoindex off;
        add_header Cache-Control "no-cache";
    }

    # RepoForge browsing UI.
    location / {
        proxy_pass http://repoforge;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
